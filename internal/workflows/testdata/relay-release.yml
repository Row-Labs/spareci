name: Release

# Pushing a tag v<version> (e.g. v0.1.0) builds every host bundle, writes
# latest.json (signed: latest.json.sig) and install.sh, uploads them to the
# release site (https://commission.sh/download, served from /srv/downloads
# on the VPS) and checks every published file, signatures included, over
# HTTPS. docs/operations/releases.md.
#
# Secrets (environment `release`): VPS_HOST, VPS_SSH_KEY (a key for
# root@VPS_HOST), RELEASE_SIGNING_KEY (the Ed25519 release key, PKCS#8 PEM;
# hubs refuse an unsigned index, and release.ts refuses to upload without
# it), and optionally VPS_KNOWN_HOSTS (the server's known_hosts line;
# without it the key is scanned on each run).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_URL: https://commission.sh/download

jobs:
  # The tag's commit passes the same gate as a pull request before anything is
  # published. Linux like ci.yml (macOS bills at 10x); only the builds that
  # need a Mac (macOS addons, the signed app) run on macOS below.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The same steps as ci.yml's checks job.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: node-pty spawn-helper is executable
        run: pnpm check:node-pty
      - name: Typecheck
        run: pnpm typecheck
      - name: OpenAPI document is up to date
        run: |
          pnpm --filter @supervisor/protocol generate:openapi
          git diff --exit-code -- packages/protocol/openapi.json
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Web build
        run: pnpm --filter @supervisor/web build

  # In slices like ci.yml: one 2-CPU runner takes ~23 min for the whole suite.
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit and contract tests (slice ${{ matrix.shard }} of 5)
        run: pnpm test --shard=${{ matrix.shard }}/5

  # macOS and Windows bundles: macOS addons are compiled here, Windows ones are prebuilt.
  bundles-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Builds the hub node sidecar into every macOS and Linux bundle (COM-225): without it a hub on that bundle has no address.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/hub-node/go.mod
          cache-dependency-path: apps/hub-node/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @supervisor/web build
      - name: Bundles
        env:
          COMMISSION_REQUIRE_HUB_NODE: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/bundle-host.ts --version "$version" --out "dist/release/v/$version" \
            --web --release-url "$RELEASE_URL" \
            --target darwin-arm64 --target darwin-x64 --target win32-x64 --target win32-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-macos
          path: dist/release/v/
          if-no-files-found: error

  # Linux bundles: node-pty and peercred compile inside node:24-bookworm (Docker; arm64 under QEMU).
  bundles-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Builds the hub node sidecar into every macOS and Linux bundle (COM-225): without it a hub on that bundle has no address.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/hub-node/go.mod
          cache-dependency-path: apps/hub-node/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @supervisor/web build
      - name: Bundles
        env:
          COMMISSION_REQUIRE_HUB_NODE: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/bundle-host.ts --version "$version" --out "dist/release/v/$version" \
            --web --release-url "$RELEASE_URL" \
            --target linux-x64-glibc --target linux-arm64-glibc
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          path: dist/release/v/
          if-no-files-found: error

  # The Mac app: universal, signed with Developer ID, notarized and stapled,
  # with a signed update archive and the updater feed (COM-24,
  # docs/operations/desktop-release.md). The certificate lives in a throwaway
  # keychain that is deleted whatever happens.
  desktop-macos:
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Apple's Developer ID intermediates (the original and G2), so codesign
          # can build the chain whichever one issued the certificate.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL --retry 2 -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          install -m 600 /dev/null "$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build, sign and notarize
        env:
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COMMISSION_TESTFLIGHT_URL: ${{ vars.COMMISSION_TESTFLIGHT_URL }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" \
          COMMISSION_UPDATER_PUBKEY_FILE="$GITHUB_WORKSPACE/apps/desktop/updater-key.pub" \
          SUPERVISOR_RELEASE_URL="$RELEASE_URL" \
            apps/desktop/scripts/release-mac.sh --version "$version" --out dist/desktop-release
          test -f "dist/desktop-release/desktop/latest.json" ||
            { echo "::error::no updater feed: the update archive was not signed"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/desktop-release/desktop/
          if-no-files-found: error
      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

  publish:
    needs: [checks, tests, bundles-macos, bundles-linux, desktop-macos]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist/release/v/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: dist/release/desktop/
      - name: SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          else
            ssh-keyscan -T 15 "$VPS_HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          fi
      - name: Index, sign, upload and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" | head -c 500)
          export RELEASE_SSH="ssh -i $RUNNER_TEMP/ssh/key -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes"
          node scripts/release.ts --version "$version" --skip-bundles \
            --desktop "dist/release/desktop/$version/Commission_${version}_universal.dmg" \
            --release-url "$RELEASE_URL" --notes "$notes" --upload
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
