# Release packaging. See docs/releasing.md.
# Validate with: go run github.com/goreleaser/goreleaser/v2@v2.19.0 check
version: 2

project_name: spareci

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: spareci
    main: ./cmd/spareci
    binary: spareci
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Sign and notarize the darwin binaries with a Developer ID Application
# certificate and an App Store Connect API key. Runs only when the release
# workflow sets MACOS_NOTARIZE=true, which it does when all five Apple secrets
# are present (see docs/releasing.md); otherwise this step is skipped and the
# binaries ship unsigned. Works from Linux: GoReleaser signs with quill, no
# Xcode needed.
notarize:
  macos:
    - ids: [spareci]
      enabled: '{{ eq (envOrDefault "MACOS_NOTARIZE" "") "true" }}'
      sign:
        # base64 of the .p12, or a path to it.
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        # base64 of the .p8, or a path to it.
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        wait: true
        # Apple's maximum; GoReleaser rejects anything longer.
        timeout: 20m

archives:
  - formats: [tar.gz]
    # spareci_darwin_arm64.tar.gz: no version in the name, so
    # releases/latest/download/spareci_<os>_<arch>.tar.gz always works.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: Row-Labs
    name: spareci

# `brew install row-labs/spareci/spareci`. Pushes Casks/spareci.rb to
# Row-Labs/homebrew-spareci using the HOMEBREW_TAP_TOKEN secret.
homebrew_casks:
  - name: spareci
    binaries: [spareci]
    homepage: https://github.com/Row-Labs/spareci
    description: Run your GitHub Actions jobs on a machine you already own
    license: MIT
    repository:
      owner: Row-Labs
      name: homebrew-spareci
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: spareci-release
      email: noreply@github.com
    commit_msg_template: "spareci {{ .Tag }}"
    # An unsigned binary is blocked by Gatekeeper on first run, so strip the
    # quarantine attribute unless this release was signed and notarized
    # (MACOS_NOTARIZE=true, see the notarize section above).
    hooks:
      post:
        install_steps: |
          {{- if ne (envOrDefault "MACOS_NOTARIZE" "") "true" }}
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/spareci"]
          end
          {{- end }}
