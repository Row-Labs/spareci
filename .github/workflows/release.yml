name: Release

# Push a v* tag to publish a release. Always on GitHub-hosted runners, so a
# release never waits on a machine running `spareci up`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short ./...
      # Sign and notarize only when all five Apple secrets are set, so releases
      # keep working (unsigned) before they exist. A partial set fails rather
      # than quietly shipping unsigned. See docs/releasing.md.
      - name: Check Apple signing secrets
        id: apple
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set=0
          for v in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -n "${!v}" ]; then set=$((set + 1)); else missing="$missing $v"; fi
          done
          if [ "$set" -eq 5 ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "macOS binaries will be signed and notarized."
          elif [ "$set" -eq 0 ]; then
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple signing secrets set; macOS binaries ship unsigned."
          else
            echo "::error::Some Apple signing secrets are set but these are missing:$missing"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          MACOS_NOTARIZE: ${{ steps.apple.outputs.notarize }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
