name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # On a machine running `spareci up` while it's up; GitHub-hosted otherwise.
    runs-on: ${{ vars.SPARECI_RUNS_ON || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/spareci ./cmd/spareci
