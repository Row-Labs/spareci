name: Site

# Deploys site/ (spareci.dev) to GitHub Pages when it changes on main.
#
# Inert until the owner turns it on:
#   1. Settings → Pages → Source: "GitHub Actions". On a private repo, Pages
#      needs a paid plan (Pro, Team or Enterprise); on a public repo it's free.
#   2. Set the repo variable SITE_PAGES to "true". Until then the deploy job is
#      skipped and uses no Actions minutes.
#   3. For spareci.dev, add the custom domain under Settings → Pages once the
#      domain's DNS points at GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SITE_PAGES == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
